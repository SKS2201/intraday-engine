name: Promote Staging To Main

on:
  workflow_run:
    workflows: ["Staging Validate"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Create or find promotion PR and enable auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:staging`;
            const base = "main";

            const prs = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head,
              base,
              per_page: 10
            });

            let pr = prs.data[0];
            if (!pr) {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                title: "chore: promote staging to production",
                head: "staging",
                base: "main",
                body: [
                  "Automated promotion PR created after successful staging validation.",
                  "",
                  "- Source branch: `staging`",
                  "- Target branch: `main`",
                  "- Trigger: `Staging Validate` workflow success"
                ].join("\n")
              });
              pr = created.data;
              core.info(`Created PR #${pr.number}`);
            } else {
              core.info(`Found existing PR #${pr.number}`);
            }

            try {
              await github.graphql(
                `mutation($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) {
                    clientMutationId
                  }
                }`,
                { pullRequestId: pr.node_id }
              );
              core.info(`Auto-merge enabled for PR #${pr.number}`);
            } catch (e) {
              core.warning(`Could not enable auto-merge for PR #${pr.number}: ${e.message}`);
            }
