name: Staging Validate

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-validate:
    runs-on: ubuntu-latest
    environment: staging
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_STAGING }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_STAGING }}
      TELEGRAM_MESSAGE_PREFIX: "[STAGING]"
      DATA_PROVIDER: SHOONYA
      SHOONYA_USER_ID: ${{ secrets.SHOONYA_USER_ID }}
      SHOONYA_PASSWORD: ${{ secrets.SHOONYA_PASSWORD }}
      SHOONYA_TOTP_SECRET: ${{ secrets.SHOONYA_TOTP_SECRET }}
      SHOONYA_VENDOR_CODE: ${{ secrets.SHOONYA_VENDOR_CODE }}
      SHOONYA_API_SECRET: ${{ secrets.SHOONYA_API_SECRET }}
      SHOONYA_IMEI: ${{ secrets.SHOONYA_IMEI }}
      SHOONYA_SESSION_TOKEN: ${{ secrets.SHOONYA_SESSION_TOKEN }}
      ENABLE_NSE_BACKUP: "true"
      ENABLE_CROSS_VALIDATION: "true"
      PRICE_DIFF_TOLERANCE_PCT: "0.35"
      VOLUME_DIFF_TOLERANCE_PCT: "10.0"
      NSE_FALLBACK_INTERVALS: "1m,5m,15m"
      TOP_LONG_CANDIDATES: "5"
      TOP_SHORT_CANDIDATES: "5"
      FILL_EMPTY_SLOTS: "true"
      ADMIN_STATUS_NOTIFICATIONS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit/integration test suite
        run: python -m pytest -q
      - name: Run stage preopen (staging)
        run: |
          mkdir -p runtime_logs
          echo "{\"job\":\"staging-preopen\",\"started_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > runtime_logs/heartbeat_staging_preopen.json
          python -m src.engine.runner --stage preopen --source-force nse > runtime_logs/staging_preopen.log 2>&1
          echo "{\"job\":\"staging-preopen\",\"finished_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"status\":\"ok\"}" >> runtime_logs/heartbeat_staging_preopen.json
      - name: Run stage openingrange (staging)
        run: |
          echo "{\"job\":\"staging-openingrange\",\"started_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > runtime_logs/heartbeat_staging_openingrange.json
          python -m src.engine.runner --stage openingrange --source-force nse > runtime_logs/staging_openingrange.log 2>&1
          echo "{\"job\":\"staging-openingrange\",\"finished_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"status\":\"ok\"}" >> runtime_logs/heartbeat_staging_openingrange.json
      - name: Upload staging runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-runtime-logs
          path: runtime_logs/
