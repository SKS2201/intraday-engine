name: Promote Staging To Main

on:
  workflow_run:
    workflows: ["Staging Validate"]
    types: [completed]
    branches: [staging]

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Create or find promotion PR and enable auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const base = "main";
              const head = "staging";

              const cmp = await github.rest.repos.compareCommits({
                owner,
                repo,
                base,
                head,
              });
              if ((cmp.data.ahead_by || 0) === 0) {
                core.info("No commits to promote from staging to main.");
                return;
              }

              const prs = await github.rest.pulls.list({
                owner,
                repo,
                state: "open",
                base,
                per_page: 30,
              });

              let pr = prs.data.find((p) => p.head.ref === head);
              if (!pr) {
                const created = await github.rest.pulls.create({
                  owner,
                  repo,
                  title: "chore: promote staging to production",
                  head,
                  base,
                  body: [
                    "Automated promotion PR created after successful staging validation.",
                    "",
                    "- Source branch: `staging`",
                    "- Target branch: `main`",
                    "- Trigger: `Staging Validate` workflow success",
                  ].join("\n"),
                });
                pr = created.data;
                core.info(`Created PR #${pr.number}`);
              } else {
                core.info(`Found existing PR #${pr.number}`);
              }

              try {
                await github.graphql(
                  `mutation($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) {
                      clientMutationId
                    }
                  }`,
                  { pullRequestId: pr.node_id }
                );
                core.info(`Auto-merge enabled for PR #${pr.number}`);
              } catch (e) {
                core.warning(`Could not enable auto-merge for PR #${pr.number}: ${e.message}`);
              }
            } catch (e) {
              core.setFailed(`promotion workflow failed: ${e.message}`);
            }
